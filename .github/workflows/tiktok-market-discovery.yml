name: TikTok public market discovery
on:
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/tiktok_market_discovery.py'
permissions:
  contents: write
concurrency:
  group: tiktok-market-discovery
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect public TikTok topic signals
        run: python3 scripts/tiktok_market_discovery.py
      - name: Update dashboard signals
        run: |
          if git diff --quiet -- tiktok-market-signals.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tiktok-market-signals.json
          git commit -m "data: refresh TikTok public market signals"
          git push
