name: TikTok Shop Callback QA
on:
  pull_request:
    paths:
      - 'backend/server.mjs'
      - 'backend/tiktok-shop-creator.mjs'
      - 'backend/tests/tiktok-shop-creator.test.mjs'
      - 'qa/tiktok-shop-callback.test.mjs'
      - '.github/workflows/tiktok-shop-callback-qa.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix backend --no-audit --no-fund
      - run: node --check backend/server.mjs
      - run: node --test qa/tiktok-shop-callback.test.mjs backend/tests/tiktok-shop-creator.test.mjs
