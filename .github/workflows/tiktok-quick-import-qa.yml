name: TikTok Quick Import QA
on:
  pull_request:
    paths:
      - 'tiktok-quick-import.js'
      - 'qa/tiktok-quick-import.spec.mjs'
      - '.github/workflows/tiktok-quick-import-qa.yml'
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock @playwright/test
      - run: npx playwright install chromium --with-deps
      - run: node --check tiktok-quick-import.js
      - run: python3 -m http.server 8765 >/tmp/bima-web.log 2>&1 &
      - run: npx playwright test qa/tiktok-quick-import.spec.mjs --browser chromium --reporter=line
