name: TikTok Connect UI QA
on:
  pull_request:
    paths:
      - 'tiktok-connection.js'
      - 'tiktok-showcase.js'
      - 'qa/tiktok-showcase.spec.mjs'
      - 'qa/tiktok-connect.spec.mjs'
      - '.github/workflows/tiktok-connect-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock @playwright/test
      - run: npx playwright install chromium --with-deps
      - run: node --check tiktok-connection.js
      - run: python3 -m http.server 8765 >/tmp/bima-web.log 2>&1 &
      - run: npx playwright test qa/tiktok-connect.spec.mjs qa/tiktok-showcase.spec.mjs --browser chromium --reporter=line
